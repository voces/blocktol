<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Canonical Blocktol mark and app/PWA icon, also rendered in-app by Logo.tsx.
       The four tiles are the core board colors (player block, game block,
       checkpoint, wall), mirroring the maze color tokens in index.html. A
       standalone SVG can't read those CSS vars, so the values are inlined here;
       if the maze palette changes, update these to match. -->
  <rect x="1" y="1" width="8" height="8" rx="1.5" fill="hsl(120, 60%, 80%)"/>
  <rect x="11" y="1" width="8" height="8" rx="1.5" fill="hsl(320, 60%, 80%)"/>
  <rect x="1" y="11" width="8" height="8" rx="1.5" fill="hsl(220, 65%, 52%)"/>
  <rect x="11" y="11" width="8" height="8" rx="1.5" fill="#404040"/>
</svg>
