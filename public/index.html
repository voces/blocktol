<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <meta name="theme-color" content="#0c0c11" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  />
  <style>
    :root {
      /* Redesign foundation tokens. Each value is light-dark(light, dark):
         it resolves against the element's `color-scheme`, so the palette
         follows the OS by default and can be pinned per theme below. */
      color-scheme: light dark;

      --background: light-dark(#f4f4f7, #0c0c11);
      --surface: light-dark(#ffffff, #20202a);
      --surface-2: light-dark(#f0f0f4, #25252f);
      --surface-3: light-dark(#e6e6ec, #2f2f3a);
      --card-background: var(--surface);
      --border: light-dark(rgba(0, 0, 0, 0.08), rgba(255, 255, 255, 0.06));
      --border-strong: light-dark(rgba(0, 0, 0, 0.14), rgba(255, 255, 255, 0.12));
      --color: light-dark(#16161c, #eceef3);
      --text-dim: light-dark(#3d3d48, #c9cad3);
      --text-mute: light-dark(#6a6a77, #8a8a97);
      --text-faint: light-dark(#9a9aa5, #6a6a72);
      --accent: light-dark(hsl(220, 72%, 50%), hsl(220, 70%, 55%));
      --accent-bright: light-dark(hsl(220, 72%, 44%), hsl(220, 70%, 62%));
      --accent-soft: light-dark(rgba(79, 131, 230, 0.12), rgba(79, 131, 230, 0.14));
      --win: light-dark(hsl(120, 50%, 38%), hsl(120, 55%, 64%));
      --warn: light-dark(hsl(42, 90%, 42%), hsl(42, 85%, 62%));
      --lose: light-dark(hsl(8, 72%, 50%), hsl(8, 72%, 60%));
      --gold: light-dark(hsl(42, 90%, 40%), hsl(45, 85%, 60%));
      /* percentile ramp: red -> yellow -> green -> blue -> purple
         (saturated enough to read on either theme) */
      --pct-0: #dc4a2f;
      --pct-1: #e0a800;
      --pct-2: #5cc24a;
      --pct-3: #3f6be0;
      --pct-4: #7a55e0;
      --font: "Space Grotesk", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --radius: 14px;
      --radius-sm: 10px;

      --maze-background: hsl(222, 55%, 77%);
      --maze-grid: hsla(222, 40%, 55%, 0.22);
      --maze-checkpoint: hsl(220, 65%, 52%);
      --maze-wall: #404040;
      --maze-text: white;
      --maze-upgrade-to-thunder: hsl(120, 60%, 65%);
      --maze-player-block: hsl(120, 60%, 80%);
      --maze-game-block: hsl(320, 60%, 80%);
      --maze-placing-block: hsl(120, 60%, 80%);
      --maze-placing-error: hsl(0, 100%, 60%);
      --maze-player-thunder: hsl(120, 60%, 50%);
      --maze-game-thunder: hsl(320, 60%, 50%);
      --maze-thunder-radius: hsla(220, 60%, 50%, 20%);
      --maze-debug-block: hsla(0, 100%, 60%, 10%);
      --maze-stroke: rgba(0, 0, 0, 0.4);
      --runner: hsl(300, 60%, 60%);
      --slow-runner: hsl(258, 36%, 53%);
      --brightness: light-dark(40%, 70%);

      --full-height: 100%;
      /* Height reserved for the app header (its padding + content, plus any
         notch inset). The board and the portrait daily-selector/log both size
         off this, so keep it in step with .app-header above. */
      --header-size: calc(68px + env(safe-area-inset-top, 0px));
      /* Footprint the HUD strip reserves above the board (min-height + bottom
         margin), folded into the board size so board + HUD fit under the
         header. Keep in step with .hud. */
      --hud-size: 48px;
      --maze-size: min(
        800px,
        100vw,
        var(--full-height) - var(--header-size) - var(--hud-size) - 8px
      );
    }

    /* Explicit theme pins from the settings screen. `system` (or no attribute)
       keeps `color-scheme: light dark` so light-dark() tracks the OS. */
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }

    * {
      box-sizing: border-box;
      /* iOS Safari needs the -webkit- prefix to stop double-tap from
         selecting text (e.g. the SVG HUD). Nothing on the page is meant to
         be user-selectable. */
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    /* Clip the board's scale(2) zoom to the viewport: it should be free to
       overflow its container and spill over the surrounding UI, but must not
       grow the page (which shifts the header and adds scroll on iOS). Full
       height so the clip region reaches the bottom of the screen — otherwise
       the body box stops at the board and the zoom is cut off below it. */
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      margin: 0;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      background-color: var(--background);
      color: var(--color);
    }

    /* Tabular monospace for times, scores, and other figures. */
    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Press feedback shared across tappable controls. */
    .tapc {
      transition: transform 0.08s ease, background 0.12s ease, opacity 0.12s ease;
    }

    .tapc:active {
      transform: scale(0.96);
    }

    /* App header: logo + wordmark, with generous breathing room above
       (clearing the status bar / notch) and below. */
    .app-header {
      display: grid;
      /* Empty 1fr balances the avatar's 1fr, keeping the brand centered. */
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 20px 20px;
    }

    .app-header__brand {
      grid-column: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile {
      grid-column: 3;
      justify-self: end;
      position: relative;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .profile__avatar {
      /* Render the emoji as a solid var(--color) glyph rather than its default
         multicolor form. */
      color: transparent;
      text-shadow: 0 0 0 var(--color);
      font-size: 20px;
      line-height: 1;
    }

    .profile__tooltip {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #444d;
      color: #fff;
      font-size: 12px;
      white-space: nowrap;
      z-index: 1;
    }

    .app-header h1 {
      margin: 0;
      font: 700 20px/1 var(--font);
      letter-spacing: 0.02em;
      color: var(--color);
    }

    /* Framed maze board. Rounded corners live on the SVG itself (not via
       overflow:hidden here) so the scale(2) zoom can still spill over the UI. */
    .board-frame {
      max-width: var(--maze-size);
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px -14px rgba(0, 0, 0, 0.7);
    }

    .board-frame > svg {
      width: 100%;
      display: block;
      border-radius: var(--radius);
      font-family: var(--font);
      /* Disable iOS double-tap-to-zoom so taps on interactive text (e.g.
         "Ready?") activate instead of zooming. */
      touch-action: manipulation;
    }

    .btn {
      padding: 10px 16px;
      margin: 1px;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #fff;
      font: 600 15px var(--font);
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .card {
      padding: 12px;
      margin: 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card-background);
    }

    a {
      color: var(--accent-bright);
      font-weight: bold;
    }

    a:hover {
      filter: brightness(75%);
      cursor: pointer;
    }

    @keyframes attemptsLoad {
      0% {
        font-size: min(calc(var(--maze-size) / 11), 64px);
        opacity: 1;
      }

      100% {
        font-size: min(calc(var(--maze-size) / 12), calc(64px * 11 / 12));
        opacity: 0;
      }
    }

    .tooltip {
      max-width: max(30%, 200px);
      background: var(--background);
      padding: 8px;
      border-radius: 4px;
      position: absolute;
      text-align: left;
    }

    .tooltip-arrow {
      position: absolute;
      border-width: calc(var(--maze-size) / 50);
      border-style: solid;
    }

    .tooltip-arrow.bottom {
      margin-bottom: calc(var(--maze-size) / -25);
      border-color: var(--background) transparent transparent transparent;
    }

    .tooltip-arrow.top {
      margin-top: calc(var(--maze-size) / -25);
      border-color: transparent transparent var(--background) transparent;
    }

    /* Game layout: board in the middle, daily-selector and log as side panels
       on landscape / stacked below on portrait. A grid so nothing depends on
       hand-computed offsets. Crucially nothing here clips overflow, so the
       board's scale(2) zoom still spills over the panels (only <body> clips). */
    .game {
      display: grid;
      gap: 8px;
      justify-content: center;
      align-items: start;
      box-sizing: border-box;
      height: calc(var(--full-height) - var(--header-size));
    }

    @media (orientation: landscape) {
      .game {
        grid-template-columns: 1fr min(var(--maze-size), 100%) 1fr;
        grid-template-areas: "daily board log";
      }
    }

    @media (orientation: portrait) {
      .game {
        grid-template-columns: min(var(--maze-size), 100%);
        grid-template-rows: auto minmax(0, 1fr);
        grid-template-areas:
          "board"
          "panel";
      }
    }

    .game__board {
      grid-area: board;
      min-width: 0;
    }

    .daily-selector {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
      align-content: start;
      padding: 8px;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: visible;
      color: white;
    }

    @media (orientation: landscape) {
      .daily-selector {
        grid-area: daily;
      }
    }

    @media (orientation: portrait) {
      .daily-selector {
        grid-area: panel;
      }
    }

    .daily-selector>span {
      height: 0;
      padding-top: 50%;
      padding-bottom: 50%;
      border-radius: 25%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .daily-selector>span.selected {
      filter: drop-shadow(-0 0 4px var(--color));
    }

    .daily-selector .daily {
      position: absolute;
      top: 10%;
      right: 10%;
      width: 25%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--color);
    }

    .log {
      display: flex;
      flex-direction: column;
      /* Positioned so the per-message "Copied!" tooltip anchors to the log. */
      position: relative;
      text-align: left;
      font-size: 14px;
      padding: 0 8px;
      max-height: 100%;
      overflow-y: auto;
    }

    @media (orientation: landscape) {
      .log {
        grid-area: log;
      }
    }

    @media (orientation: portrait) {
      .log {
        grid-area: panel;
      }

      /* On portrait the daily list and the log share the one panel slot, so
         hide the log while the list is up. */
      .log.show-list {
        display: none;
      }
    }

    /* Build-phase HUD strip above the board (see Hud.tsx). */
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      /* Reserve height even when empty so the board doesn't shift when the
         build phase (and the chips) load in. Matches the chip height below. */
      min-height: 36px;
      max-width: var(--maze-size);
      margin: 0 auto 12px;
    }

    .hud__chips {
      display: flex;
      gap: 8px;
    }

    .hud__chip {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }

    .hud__chip .mono {
      font-size: 15px;
      font-weight: 700;
      color: var(--color);
    }

    /* The build clock: always tappable to start now. The countdown and "Ready?"
       are stacked in one grid cell so the chip keeps the (wider) countdown's
       width and can cross-fade between them without a reflow. */
    .hud__build {
      position: relative;
      display: inline-grid;
      place-items: center;
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 11px;
      background: var(--accent-bright);
      color: #fff;
      cursor: pointer;
    }

    .hud__build-face {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: opacity 0.12s ease;
    }

    .hud__build .mono {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .hud__build-label {
      font: 600 12px var(--font);
      color: rgba(255, 255, 255, 0.85);
    }

    /* Run clock: the build slot, now counting the live run up. */
    .hud__run {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 14px;
      border-radius: 11px;
      background: var(--accent-bright);
      color: #fff;
    }

    .hud__run .mono {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      /* Fixed width so the count-up doesn't jitter the chip as digits change. */
      min-width: 4ch;
      text-align: right;
    }

    .hud__build-ready {
      font: 700 15px var(--font);
      color: #fff;
      opacity: 0;
    }

    /* Out of resources or idle: pulse between the remaining time and "Ready?". */
    .hud__build.flashing .hud__build-time {
      animation: buildFadeTime 1.5s ease-in-out infinite alternate;
    }

    .hud__build.flashing .hud__build-ready {
      animation: buildFadeReady 1.5s ease-in-out infinite alternate;
    }

    @keyframes buildFadeTime {
      0%, 50% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }

    @keyframes buildFadeReady {
      0%, 50% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }

    /* On hover or press, commit to showing "Ready?" outright. */
    .hud__build:hover .hud__build-time,
    .hud__build.pressing .hud__build-time {
      opacity: 0;
      animation: none;
    }

    .hud__build:hover .hud__build-ready,
    .hud__build.pressing .hud__build-ready {
      opacity: 1;
      animation: none;
    }

    /* Staged free-play: the clock is frozen and inert until the first placement
       opens the run, so it reads as idle and ignores hover/press. */
    .hud__build--staged {
      cursor: default;
      background: var(--accent);
    }

    .hud__build--staged:hover .hud__build-time {
      opacity: 1;
    }

    /* Daily result modal (see Daily.tsx). */
    .result {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(6, 6, 10, 0.72);
    }

    .result__card {
      width: 100%;
      max-width: 300px;
      padding: 22px;
      border: 1px solid var(--border-strong);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8);
      text-align: left;
    }

    .result__header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
    }

    .result__title {
      margin: 0;
      font: 700 17px var(--font);
      color: var(--color);
    }

    .result__rows {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 12px;
    }

    .result__row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-2);
    }

    /* Best attempt: a border and fill tinted to --accent (green for best). */
    .result__row--best {
      border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface-2));
    }

    /* The glow is reserved for supreme (record) results — on the row and the
       matching "you beat 100%" banner. */
    .result__row--glow {
      box-shadow: 0 0 16px -2px color-mix(in srgb, var(--accent) 55%, transparent);
    }

    .result__banner--glow {
      box-shadow: 0 0 16px -2px color-mix(in srgb, var(--beat) 55%, transparent);
    }

    .result__metric {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .result__label {
      display: flex;
      align-items: center;
      gap: 8px;
      font: 600 13px var(--font);
      color: var(--text-dim);
    }

    .result__badge {
      padding: 2px 6px;
      border-radius: 5px;
      font: 700 9px var(--font);
      letter-spacing: 0.1em;
      color: var(--badge, var(--win));
      background: color-mix(in srgb, var(--badge, var(--win)) 16%, transparent);
    }

    .result__pct {
      font: 500 11px var(--font);
      color: var(--text-mute);
    }

    .result__time {
      font-size: 17px;
      font-weight: 700;
      color: var(--color);
    }

    .result__banner {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 11px 14px;
      border: 1px solid color-mix(in srgb, var(--beat) 34%, transparent);
      border-radius: 11px;
      background: color-mix(in srgb, var(--beat) 9%, transparent);
      font: 600 13px var(--font);
      color: var(--text-dim);
    }

    .result__banner b {
      color: var(--beat);
    }

    .result__stats {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .result__stat {
      flex: 1;
      padding: 10px 12px;
      border-radius: 11px;
      background: var(--surface-2);
      text-align: center;
    }

    .result__stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--color);
    }

    .result__stat-label {
      margin-top: 2px;
      font: 500 10px var(--font);
      color: var(--text-mute);
    }

    .result__actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result__btn {
      width: 100%;
      margin: 0;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .result__btn--keep {
      background: var(--slow-runner);
    }
  </style>
</head>

<body>
  <script src="/js/index.js" type="module"></script>
</body>

</html>
