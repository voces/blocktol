<!DOCTYPE html>
<html>

<head>
  <!-- viewport-fit=cover: draw edge-to-edge into the status-bar/cutout insets so
       the app's themed background paints that top strip (otherwise it's an
       unpainted black band). It also makes env(safe-area-inset-*) report real
       values, which the CSS already relies on for its top padding. -->
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, viewport-fit=cover"
  />
  <!-- Status/URL/PWA bar colour, matched to the app background (the --background
       light-dark() token's two ends). A SINGLE meta, kept in sync with the
       resolved theme by applyTheme (client/hooks/useSettings.ts) — deliberately
       NOT keyed to the OS via prefers-color-scheme media, because the theme is a
       user setting that can diverge from the OS (a dark app on a light phone
       would otherwise get a light bar). Default is the dark brand background; JS
       corrects it on boot, including following the OS live in "system" mode. -->
  <meta name="theme-color" content="#0c0c11" id="theme-color" />
  <title>Blocktol</title>
  <meta
    name="description"
    content="A daily maze puzzle — place blocks to build the longest path and outlast the runner. Three ranked attempts a day, then free play."
  />
  <!-- Open Graph / Twitter Card: these drive the link preview on Reddit, search,
       and social. We WANT a card there (the launch storefront). Chat apps are
       silenced instead at the crawler level — public/robots.txt disallows
       Discordbot/Slackbot, which build embeds server-side and honor robots.txt —
       so a shared link posts as a plain link in chat while a Reddit post still
       gets a full card. og:image is an absolute URL (scrapers don't resolve
       relative refs). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Blocktol" />
  <meta property="og:title" content="Blocktol" />
  <meta
    property="og:description"
    content="A daily maze puzzle. Place blocks to build the longest path and outlast the runner. Three ranked attempts a day, then free play."
  />
  <meta property="og:url" content="https://blocktol.com/" />
  <meta property="og:image" content="https://blocktol.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Blocktol: a daily maze puzzle" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blocktol" />
  <meta
    name="twitter:description"
    content="A daily maze puzzle. Build the longest path and outlast the runner."
  />
  <meta name="twitter:image" content="https://blocktol.com/og.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- iOS ignores SVG favicons and manifest icons for home-screen installs;
       it uses this PNG (and falls back to a page screenshot without it). -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <script src="/js/index.js" type="module"></script>
</body>

</html>
