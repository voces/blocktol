<!DOCTYPE html>
<html>

<head>
  <!-- viewport-fit=cover: paint the themed background under the status bar
       (else it is a black band). Also makes env(safe-area-inset-*) report real
       values, which the CSS uses for top padding. -->
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, viewport-fit=cover"
  />
  <!-- Status/URL/PWA bar colour, matching the --background light-dark() token.
       A SINGLE meta that applyTheme (client/hooks/useSettings.ts) keeps in sync
       with the resolved theme. Not keyed to prefers-color-scheme: the theme is
       a user setting that can differ from the OS. Defaults to the dark
       background until JS corrects it on boot. -->
  <meta name="theme-color" content="#0c0c11" id="theme-color" />
  <title>Blocktol</title>
  <meta
    name="description"
    content="A daily maze puzzle — place blocks to build the longest path and outlast the runner. Three ranked attempts a day, then free play."
  />
  <!-- Open Graph / Twitter Card: the link preview on Reddit, search and social.
       Chat embeds are suppressed in public/robots.txt (Discordbot/Slackbot
       honor it), so chat gets a plain link. og:image must be absolute:
       scrapers don't resolve relative refs. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Blocktol" />
  <meta property="og:title" content="Blocktol" />
  <meta
    property="og:description"
    content="A daily maze puzzle. Place blocks to build the longest path and outlast the runner. Three ranked attempts a day, then free play."
  />
  <meta property="og:url" content="https://blocktol.com/" />
  <meta property="og:image" content="https://blocktol.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Blocktol: a daily maze puzzle" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Blocktol" />
  <meta
    name="twitter:description"
    content="A daily maze puzzle. Build the longest path and outlast the runner."
  />
  <meta name="twitter:image" content="https://blocktol.com/og.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- iOS ignores SVG favicons and manifest icons for home-screen installs and
       screenshots the page without this PNG. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- Self-hosted fonts (public/fonts/) — no request to Google. -->
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <script src="/js/index.js" type="module"></script>
</body>

</html>
