<!DOCTYPE html>
<html>

<head>
  <!-- viewport-fit=cover: draw edge-to-edge into the status-bar/cutout insets so
       the app's themed background paints that top strip (otherwise it's an
       unpainted black band). It also makes env(safe-area-inset-*) report real
       values, which the CSS already relies on for its top padding. -->
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, viewport-fit=cover"
  />
  <!-- Status/URL/PWA bar colour, matched to the app background (the --background
       light-dark() token's two ends). A SINGLE meta, kept in sync with the
       resolved theme by applyTheme (client/hooks/useSettings.ts) — deliberately
       NOT keyed to the OS via prefers-color-scheme media, because the theme is a
       user setting that can diverge from the OS (a dark app on a light phone
       would otherwise get a light bar). Default is the dark brand background; JS
       corrects it on boot, including following the OS live in "system" mode. -->
  <meta name="theme-color" content="#0c0c11" id="theme-color" />
  <title>Blocktol</title>
  <meta
    name="description"
    content="A daily maze puzzle — place blocks to build the longest path and outlast the runner. Three ranked attempts a day, then free play."
  />
  <!-- Deliberately no Open Graph / Twitter Card tags. Unfurlers (Discord, Slack,
       Twitter/X) build their link embed from og:* / twitter:*; there is no
       standard "don't embed" directive, so the way to suppress the embed while
       keeping the browser-tab title is to omit those tags. <title> and the
       description above are for the tab and search results, not the embed. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <script src="/js/index.js" type="module"></script>
</body>

</html>
