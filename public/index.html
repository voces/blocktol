<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, user-scalable=no" />
  <!-- Match the status/URL bar to the app background per OS theme (the values of
       the --background light-dark() token). The browser picks by media query, so
       the PWA's top bar follows light/dark instead of being fixed dark. -->
  <meta
    name="theme-color"
    content="#f4f4f7"
    media="(prefers-color-scheme: light)"
  />
  <meta
    name="theme-color"
    content="#0c0c11"
    media="(prefers-color-scheme: dark)"
  />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
  />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <script src="/js/index.js" type="module"></script>
</body>

</html>
