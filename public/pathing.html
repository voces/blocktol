<!DOCTYPE html>
<html>

<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>

<body>
  <svg id="svg"></svg>
  <script type="module">
    // Debug page for the pathing engine, on real game semantics: the 20×20
    // board with its border ring, 2×2 pieces, and a checkpoint cell — solved
    // by the same PathSolver the game runs.
    //   click        place a 2×2 piece anchored at the cell / remove the piece
    //                covering the cell
    //   alt-click    move the checkpoint to the cell
    //   shift-click  toggle a placed piece between block and thunder
    // The path, its exact length, and pathDuration's [duration, slows] log to
    // the console on every change.
    import { newGrid, PathSolver, pathDuration } from "./js/pathing.js";

    const SIZE = 20;

    const svg = document.getElementById("svg");
    svg.setAttribute("width", SIZE);
    svg.setAttribute("height", SIZE);
    svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);

    const colorWalkable = "#77aaee";
    const colorWall = "#445566";
    const colorBlock = "#ee77dd";
    const colorThunder = "#eeee77";
    const colorCheckpoint = "#77ee77";

    let checkpoint = { x: 9.5, y: 9.5 };
    const pieces = (globalThis.pieces = []);

    const pieceAt = (x, y) =>
      pieces.find((p) => x >= p.x && x <= p.x + 1 && y >= p.y && y <= p.y + 1);

    const walls = newGrid();

    const cellColor = (x, y) => {
      if (walls[y][x]) return colorWall;
      if (x === checkpoint.x + 0.5 && y === checkpoint.y + 0.5) {
        return colorCheckpoint;
      }
      const piece = pieceAt(x, y);
      if (piece) return piece.thunder ? colorThunder : colorBlock;
      return colorWalkable;
    };

    const cells = [];
    const pathElements = [];

    const repaint = () => {
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          cells[y][x].setAttribute("fill", cellColor(x, y));
        }
      }
    };

    const createPathLine = (start, end) => {
      const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "line",
      );
      line.setAttribute("x1", start.x + 0.5);
      line.setAttribute("y1", start.y + 0.5);
      line.setAttribute("x2", end.x + 0.5);
      line.setAttribute("y2", end.y + 0.5);
      line.setAttribute("stroke-width", 0.15);
      line.setAttribute("stroke", "rgba(0,0,0,0.5)");
      svg.appendChild(line);
      pathElements.push(line);
    };

    const redoPath = () => {
      for (const el of pathElements) svg.removeChild(el);
      pathElements.splice(0);

      let path;
      try {
        path = new PathSolver(pieces, checkpoint).solve([]);
      } catch (err) {
        console.error(err);
        return;
      }
      if (!path) {
        console.log("no path");
        return;
      }
      let length = 0;
      for (let i = 1; i < path.length; i++) {
        length += Math.hypot(
          path[i].x - path[i - 1].x,
          path[i].y - path[i - 1].y,
        );
        createPathLine(path[i - 1], path[i]);
      }
      console.log(
        path,
        `length ${length}`,
        pathDuration(path, pieces.filter((p) => p.thunder)),
      );
    };

    for (let y = 0; y < SIZE; y++) {
      cells.push([]);
      for (let x = 0; x < SIZE; x++) {
        const cell = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "rect",
        );
        cell.setAttribute("y", y);
        cell.setAttribute("x", x);
        cell.setAttribute("width", 1);
        cell.setAttribute("height", 1);

        cell.addEventListener("click", (e) => {
          if (walls[y][x]) return;
          const existing = pieceAt(x, y);
          if (e.altKey) {
            if (!existing) checkpoint = { x: x - 0.5, y: y - 0.5 };
          } else if (e.shiftKey) {
            if (existing) existing.thunder = !existing.thunder;
          } else if (existing) {
            pieces.splice(pieces.indexOf(existing), 1);
          } else {
            // Anchor clamped so the 2×2 piece stays inside the interior; only
            // place when all four cells are free (like the game does).
            const ax = Math.min(x, 17);
            const ay = Math.min(y, 17);
            const free = [0, 1].every((dx) =>
              [0, 1].every((dy) =>
                !walls[ay + dy][ax + dx] && !pieceAt(ax + dx, ay + dy) &&
                !(ax + dx === checkpoint.x + 0.5 &&
                  ay + dy === checkpoint.y + 0.5)
              )
            );
            if (free) pieces.push({ x: ax, y: ay });
          }
          repaint();
          redoPath();
        });

        svg.appendChild(cell);
        cells[y].push(cell);
      }
    }

    repaint();
    redoPath();
  </script>
  <style>
    svg {
      width: calc(100vw - 16px);
      height: calc(100vh - 16px);
      display: block;
    }

    rect {
      cursor: pointer;
      opacity: 1;
    }

    rect:hover {
      filter: brightness(80%) saturate(125%);
    }

    line {
      pointer-events: none;
    }
  </style>
</body>

</html>
