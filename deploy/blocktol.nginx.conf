# Reference template for the blocktol nginx vhost on the EC2 cohost. Nothing reads
# this file live — the authoritative copy is /etc/nginx/sites-enabled/blocktol.conf
# (this box keeps vhosts directly in sites-enabled, no sites-available), copied
# from here. This is the pre-TLS (port 80) block; certbot adds the 443 listener +
# redirect in place (see the TLS step in deploy/README.md). `proxy_params` is the
# box's shared include (Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto),
# matching the sibling vhosts. The `blocktol` log format and the
# $blocktol_tp_span map used below are declared in blocktol-trace.conf (conf.d/).
server {
    listen 80;
    listen [::]:80;
    server_name blocktol.com www.blocktol.com;

    # Well above the app's own 64 KiB cap (MAX_BODY_BYTES); turns away bigger
    # uploads with a 413 before they reach the app.
    client_max_body_size 256k;

    # Own access log, in the `blocktol` format (adds rt=, us= and trace=, the
    # request's trace id in VictoriaTraces). Replaces the shared access.log for
    # this vhost. Rotated by the stock /etc/logrotate.d/nginx (*.log).
    access_log /var/log/nginx/blocktol.access.log blocktol;

    # Compress text responses from the app, which sends them uncompressed (nginx
    # leaves any that already carry Content-Encoding alone). text/html is always
    # included; woff2/PNG are already compressed, so they're left out.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:3040;
        include /etc/nginx/proxy_params;
        # Names the request's trace (see blocktol-trace.conf) and replaces any
        # client-sent traceparent. Repeated in each location: a location that
        # sets any proxy_set_header (proxy_params does) inherits none from the
        # server level.
        proxy_set_header traceparent "00-$request_id-$blocktol_tp_span-01";
    }

    # Per-IP limit on the API (zone: blocktol-ratelimit.conf, in conf.d/). Far
    # above any real player — boot is one call, ranked saves are debounced, free
    # play commits once per run — with burst room for a reconnect's catch-up.
    # A location doesn't inherit the proxy settings, so they're repeated here.
    location /api/ {
        limit_req zone=blocktol_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3040;
        include /etc/nginx/proxy_params;
        proxy_set_header traceparent "00-$request_id-$blocktol_tp_span-01";
    }
}
