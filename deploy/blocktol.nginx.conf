# nginx vhost for blocktol — reverse-proxies the domain to the local Deno server.
# Drop into the box's nginx (sites-available + symlink, or conf.d), adjust
# server_name and the proxy port to match .env's PORT, then run
# `certbot --nginx -d blocktol.w3x.io` to add the TLS listener + redirect (certbot
# rewrites this block in place). This is the pre-TLS (port 80) block.
server {
    listen 80;
    server_name blocktol.w3x.io;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
