# Reference template for the blocktol nginx vhost on the EC2 cohost. Nothing reads
# this file live — the authoritative copy is /etc/nginx/sites-enabled/blocktol.conf
# (this box keeps vhosts directly in sites-enabled, no sites-available), copied
# from here. This is the pre-TLS (port 80) block; certbot adds the 443 listener +
# redirect in place (see the TLS step in deploy/README.md). `proxy_params` is the
# box's shared include (Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto),
# matching the sibling vhosts.
server {
    listen 80;
    listen [::]:80;
    server_name blocktol.com www.blocktol.com;

    location / {
        proxy_pass http://127.0.0.1:3040;
        include /etc/nginx/proxy_params;
    }
}
