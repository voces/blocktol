# Reference template for /etc/nginx/conf.d/blocktol-trace.conf. Nothing reads
# this file live. `map` and `log_format` must sit in the `http` context, which a
# vhost file can't hold; the stock nginx.conf includes conf.d/*.conf there. The
# blocktol vhost (blocktol.nginx.conf) uses both.
#
# nginx names each request's trace: it passes `$request_id` (32 random hex, the
# length of a W3C trace id) to blocktol as `traceparent`, and Deno's OTel adopts
# it as the request span's trace id. The same id is logged as `trace=` in
# blocktol.access.log, so an nginx line joins the request's blocktol trace and
# logs. The vhost's proxy_set_header also replaces any client-sent
# `traceparent`, so a client can't pick its own trace id.
#
# The parent span id is the last 16 hex of `$request_id`. nginx records no span
# of its own, so trace viewers show blocktol's root span with a missing parent.
map $request_id $blocktol_tp_span {
    "~^.{16}(?<s>.{16})$" $s;
}

# nginx's `combined` format plus request time, upstream status and trace id.
log_format blocktol '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'us=$upstream_status trace=$request_id';
