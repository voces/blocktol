# Reference template for /etc/nginx/conf.d/blocktol-ratelimit.conf. Nothing reads
# this file live. `limit_req_zone` must sit in the `http` context, which a vhost
# file can't hold; the stock nginx.conf includes conf.d/*.conf there. The vhost's
# `location /api/` (blocktol.nginx.conf) applies the limit.
#
# Keyed per client IP (nginx terminates TLS itself, so $binary_remote_addr is the
# real client). 10m holds ~160k addresses.
limit_req_zone $binary_remote_addr zone=blocktol_api:10m rate=10r/s;

# The dev vhost (blocktol-dev.nginx.conf) gets its own zone at the same rate.
limit_req_zone $binary_remote_addr zone=blocktol_dev_api:10m rate=10r/s;
