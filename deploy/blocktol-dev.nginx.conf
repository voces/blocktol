# Reference template for the DEV vhost on the EC2 cohost. Nothing reads this
# file live — the authoritative copy is
# /etc/nginx/sites-enabled/blocktol-dev.conf, copied from here. It mirrors
# blocktol.nginx.conf (read that one for the why of each directive) with the dev
# name, port, log and rate-limit zone. Pre-TLS (port 80); certbot adds the 443
# listener + redirect in place (see "Dev instance" in deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name dev.blocktol.com;

    client_max_body_size 256k;

    access_log /var/log/nginx/blocktol-dev.access.log blocktol;

    # Dev is public (as the Deno Deploy previews were) but must not be indexed
    # next to blocktol.com. `always` covers error responses too.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript
        application/json application/manifest+json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:3041;
        include /etc/nginx/proxy_params;
        proxy_set_header traceparent "00-$request_id-$blocktol_tp_span-01";
    }

    # Its own zone, so testing against dev can't spend a player's prod budget.
    location /api/ {
        limit_req zone=blocktol_dev_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3041;
        include /etc/nginx/proxy_params;
        proxy_set_header traceparent "00-$request_id-$blocktol_tp_span-01";
    }
}
