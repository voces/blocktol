# Reference template — nothing reads this file live. The authoritative copy is
# /etc/systemd/journald.conf.d/size.conf, copied from here. Box-wide: caps the
# persistent journal every service on the cohost logs into.
[Journal]
# Cap persistent journal size (was ~1.1G uncapped).
SystemMaxUse=500M
# And its age: blocktol's stdout lands here too, and the privacy page promises
# diagnostics are deleted after about 30 days.
MaxRetentionSec=30day
