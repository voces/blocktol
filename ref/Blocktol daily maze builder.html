  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

7\" width=\"4\" height=\"10.5\" rx=\"1\"><\u002Frect><rect x=\"13.5\" y=\"3\" width=\"4\" height=\"14.5\" rx=\"1\"><\u002Frect><\u002Fg><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ n.isGlobal }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 20 20\"><path d=\"M3 6.2l3.4 3.1L10 4.2l3.6 5.1L17 6.2l-1.2 8.9H4.2L3 6.2z\" fill=\"hsl(8,72%,60%)\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ n.isHeat }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"19\" height=\"19\" viewBox=\"0 0 20 20\"><path d=\"M3 6.2l3.4 3.1L10 4.2l3.6 5.1L17 6.2l-1.2 8.9H4.2L3 6.2z\" fill=\"hsl(320,58%,64%)\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">{{ n.title }}<\u002Fdiv>\n                  <div style=\"font:500 13px 'Space Grotesk';color:#9a9aa7;margin-top:3px;line-height:1.4\">{{ n.body }}<\u002Fdiv>\n                  <div style=\"font:500 11px 'Space Grotesk';color:#5f5f6c;margin-top:7px\">{{ n.time }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ n.unread }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:hsl(220,70%,64%);margin-top:6px\"><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"text-align:center;margin-top:12px;font:500 11px 'Space Grotesk';color:#5f5f6c\">Concept — pushed when the day closes and ratings settle<\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ============ PROFILE ============ -->\n          <sc-if value=\"{{ isProfile }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:4px 16px 20px\">\n            <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n              <div style=\"width:64px;height:64px;border-radius:18px;background:hsl(268,50%,58%);display:flex;align-items:center;justify-content:center;font:700 28px 'Space Grotesk';color:#fff;flex:none;box-shadow:0 8px 20px -8px hsl(268,50%,58%)\">{{ avatarInitial }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font:700 21px 'Space Grotesk';color:#eceef3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ displayName }}<\u002Fspan>\n                  <button class=\"tapc\" onclick=\"{{ goName }}\" aria-label=\"Edit name\" style=\"border:0;background:#20202a;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\"><path d=\"M9.5 2.5l2 2L5 11l-2.5.5L3 9z\" fill=\"none\" stroke=\"#b9bac6\" stroke-width=\"1.3\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div class=\"mono\" style=\"font-size:12px;color:#7a7a88;margin-top:3px\">joined Mar 2026<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right;flex:none\">\n                <div class=\"mono\" style=\"font-size:24px;font-weight:700;color:hsl(45,85%,62%)\">1000<\u002Fdiv>\n                <div style=\"font:600 10px 'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;color:#7a7a88\">Rating<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px\">\n              <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 10px;text-align:center\">\n                <div class=\"mono\" style=\"font-size:24px;font-weight:700;color:#eceef3\">128<\u002Fdiv>\n                <div style=\"font:500 11px 'Space Grotesk';color:#7a7a88;margin-top:2px\">Played<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 10px;text-align:center\">\n                <div class=\"mono\" style=\"font-size:24px;font-weight:700;color:hsl(120,55%,62%)\">17<\u002Fdiv>\n                <div style=\"font:500 11px 'Space Grotesk';color:#7a7a88;margin-top:2px\">Streak<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 10px;text-align:center\">\n                <div class=\"mono\" style=\"font-size:24px;font-weight:700;color:#eceef3\">34<\u002Fdiv>\n                <div style=\"font:500 11px 'Space Grotesk';color:#7a7a88;margin-top:2px\">Max streak<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px\">\n              <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px\">\n                <div class=\"mono\" style=\"font-size:22px;font-weight:700;color:hsl(220,70%,66%)\">52.4s<\u002Fdiv>\n                <div style=\"font:500 11px 'Space Grotesk';color:#7a7a88;margin-top:2px\">Best build<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 16px\">\n                <div class=\"mono\" style=\"font-size:22px;font-weight:700;color:#eceef3\">p78<\u002Fdiv>\n                <div style=\"font:500 11px 'Space Grotesk';color:#7a7a88;margin-top:2px\">Median percentile<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 12px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 10px\">Last 14 days<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px\">\n              <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"14\">\n                <div style=\"aspect-ratio:1;border-radius:8px;background:{{ h.bg }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <button class=\"tapc\" style=\"width:100%;border:0;background:hsl(220,70%,62%);color:#fff;border-radius:13px;padding:14px;font:700 15px 'Space Grotesk';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:9px\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><g fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"3.5\" r=\"2\"><\u002Fcircle><circle cx=\"4\" cy=\"8\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"12.5\" r=\"2\"><\u002Fcircle><line x1=\"5.7\" y1=\"7\" x2=\"10.3\" y2=\"4.5\"><\u002Fline><line x1=\"5.7\" y1=\"9\" x2=\"10.3\" y2=\"11.5\"><\u002Fline><\u002Fg><\u002Fsvg>\n              Share profile\n            <\u002Fbutton>\n            <button class=\"tapc\" onclick=\"{{ copyLink }}\" style=\"width:100%;border:1px solid rgba(255,255,255,.1);background:#20202a;color:#d5d6de;border-radius:13px;padding:14px;font:600 14px 'Space Grotesk';cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><g fill=\"none\" stroke=\"#b9bac6\" stroke-width=\"1.5\" stroke-linecap=\"round\"><rect x=\"5.5\" y=\"1.5\" width=\"9\" height=\"9\" rx=\"2\"><\u002Frect><path d=\"M10.5 12.5v1a1.5 1.5 0 0 1-1.5 1.5H3a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 3 5.5h1\"><\u002Fpath><\u002Fg><\u002Fsvg>\n              <sc-if value=\"{{ copied }}\" hint-placeholder-val=\"{{ false }}\">Copied login link!<\u002Fsc-if>\n              <sc-if value=\"{{ notCopied }}\" hint-placeholder-val=\"{{ true }}\">Copy login link · move device<\u002Fsc-if>\n            <\u002Fbutton>\n\n            <button class=\"tapc\" onclick=\"{{ goSettings }}\" style=\"width:100%;margin-top:9px;border:1px solid rgba(255,255,255,.08);background:#20202a;border-radius:13px;padding:14px 15px;cursor:pointer;display:flex;align-items:center;gap:11px\">\n              <svg width=\"17\" height=\"17\" viewBox=\"0 0 18 18\"><g stroke=\"#b9bac6\" stroke-width=\"1.6\" stroke-linecap=\"round\"><line x1=\"3\" y1=\"5\" x2=\"15\" y2=\"5\"><\u002Fline><line x1=\"3\" y1=\"9\" x2=\"15\" y2=\"9\"><\u002Fline><line x1=\"3\" y1=\"13\" x2=\"15\" y2=\"13\"><\u002Fline><\u002Fg><circle cx=\"6\" cy=\"5\" r=\"2.1\" fill=\"#20202a\" stroke=\"#b9bac6\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"12\" cy=\"9\" r=\"2.1\" fill=\"#20202a\" stroke=\"#b9bac6\" stroke-width=\"1.6\"><\u002Fcircle><circle cx=\"7\" cy=\"13\" r=\"2.1\" fill=\"#20202a\" stroke=\"#b9bac6\" stroke-width=\"1.6\"><\u002Fcircle><\u002Fsvg>\n              <span style=\"flex:1;text-align:left;font:600 15px 'Space Grotesk';color:#eceef3\">Settings<\u002Fspan>\n              <svg width=\"8\" height=\"13\" viewBox=\"0 0 8 13\"><path d=\"M1.5 1.5L6 6.5L1.5 11.5\" fill=\"none\" stroke=\"#6a6a77\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- ============ SETTINGS ============ -->\n          <sc-if value=\"{{ isSettings }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:4px 16px 20px\">\n            <div style=\"font:700 22px 'Space Grotesk';color:#eceef3;margin-bottom:18px\">Settings<\u002Fdiv>\n\n            <div style=\"font:600 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 8px\">Notifications<\u002Fdiv>\n            <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;margin-bottom:20px\">\n              <div class=\"tapc\" onclick=\"{{ toggleNResults }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <div style=\"flex:1\"><div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">Daily results ready<\u002Fdiv><div style=\"font:500 12px 'Space Grotesk';color:#8a8a97;margin-top:3px;line-height:1.35\">When the day closes and ratings settle.<\u002Fdiv><\u002Fdiv>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ nResultsTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ nResultsKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ toggleNGlobal }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <span style=\"flex:1;font:600 15px 'Space Grotesk';color:#eceef3\">Lost Global Supreme<\u002Fspan>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ nGlobalTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ nGlobalKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ toggleNHeat }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <span style=\"flex:1;font:600 15px 'Space Grotesk';color:#eceef3\">Lost group top spot<\u002Fspan>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ nHeatTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ nHeatKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ toggleNReminder }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px\">\n                <div style=\"flex:1\"><div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">Daily maze reminder<\u002Fdiv><div style=\"font:500 12px 'Space Grotesk';color:#8a8a97;margin-top:3px;line-height:1.35\">An evening nudge if you haven't played.<\u002Fdiv><\u002Fdiv>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ nReminderTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ nReminderKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 8px\">Gameplay<\u002Fdiv>\n            <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;margin-bottom:20px\">\n              <div style=\"padding:14px 15px 16px\">\n                <div style=\"display:flex;align-items:baseline;gap:12px\">\n                  <div style=\"flex:1\">\n                    <div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">Zoom when placing<\u002Fdiv>\n                    <div style=\"font:500 12px 'Space Grotesk';color:#8a8a97;margin-top:3px;line-height:1.35\">Magnifies the board on touch for precise placement.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <span class=\"mono\" style=\"flex:none;font:700 13px 'JetBrains Mono';color:{{ zoomLabelColor }};background:#17171e;border-radius:8px;padding:5px 9px;min-width:52px;text-align:center\">{{ zoomLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <input type=\"range\" class=\"zrange\" min=\"0\" max=\"100\" step=\"5\" value=\"{{ zoomLevel }}\" onchange=\"{{ setZoom }}\" style=\"margin-top:14px;background:{{ zoomFill }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 8px\">Feedback<\u002Fdiv>\n            <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden;margin-bottom:20px\">\n              <div class=\"tapc\" onclick=\"{{ toggleSound }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <span style=\"flex:1;font:600 15px 'Space Grotesk';color:#eceef3\">Sound effects<\u002Fspan>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ soundTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ soundKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ toggleHaptics }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <span style=\"flex:1;font:600 15px 'Space Grotesk';color:#eceef3\">Haptics<\u002Fspan>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ hapticsTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ hapticsKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ toggleMotion }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px\">\n                <div style=\"flex:1\">\n                  <div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">Reduced motion<\u002Fdiv>\n                  <div style=\"font:500 12px 'Space Grotesk';color:#8a8a97;margin-top:3px;line-height:1.35\">Turns off screen-transition animations. The runner and board are unaffected.<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"flex:none;width:46px;height:27px;border-radius:14px;background:{{ motionTrack }};position:relative;transition:background .15s\"><span style=\"position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;transform:translateX({{ motionKnob }})\"><\u002Fspan><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 8px\">Appearance<\u002Fdiv>\n            <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px 15px;margin-bottom:20px\">\n              <div style=\"font:600 15px 'Space Grotesk';color:#eceef3;margin-bottom:11px\">Theme<\u002Fdiv>\n              <div style=\"display:flex;gap:6px;background:#17171e;border-radius:11px;padding:4px\">\n                <button class=\"tapc\" onclick=\"{{ setThemeSystem }}\" style=\"flex:1;border:0;border-radius:8px;padding:9px;cursor:pointer;font:600 13px 'Space Grotesk';background:{{ segSystemBg }};color:{{ segSystemColor }}\">System<\u002Fbutton>\n                <button class=\"tapc\" onclick=\"{{ setThemeLight }}\" style=\"flex:1;border:0;border-radius:8px;padding:9px;cursor:pointer;font:600 13px 'Space Grotesk';background:{{ segLightBg }};color:{{ segLightColor }}\">Light<\u002Fbutton>\n                <button class=\"tapc\" onclick=\"{{ setThemeDark }}\" style=\"flex:1;border:0;border-radius:8px;padding:9px;cursor:pointer;font:600 13px 'Space Grotesk';background:{{ segDarkBg }};color:{{ segDarkColor }}\">Dark<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font:600 11px 'Space Grotesk';letter-spacing:.1em;text-transform:uppercase;color:#7a7a88;margin:0 2px 8px\">Account<\u002Fdiv>\n            <div style=\"background:#20202a;border:1px solid rgba(255,255,255,.06);border-radius:14px;overflow:hidden\">\n              <div class=\"tapc\" onclick=\"{{ goName }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.05)\">\n                <span style=\"flex:1;font:600 15px 'Space Grotesk';color:#eceef3\">Display name<\u002Fspan>\n                <span style=\"font:500 14px 'Space Grotesk';color:#8a8a97\">{{ displayName }}<\u002Fspan>\n                <svg width=\"8\" height=\"13\" viewBox=\"0 0 8 13\"><path d=\"M1.5 1.5L6 6.5L1.5 11.5\" fill=\"none\" stroke=\"#6a6a77\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"tapc\" onclick=\"{{ copyLink }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 15px\">\n                <div style=\"flex:1\">\n                  <div style=\"font:600 15px 'Space Grotesk';color:#eceef3\">Move to another device<\u002Fdiv>\n                  <div style=\"font:500 12px 'Space Grotesk';color:#8a8a97;margin-top:3px\">Copy your login link or scan the code.<\u002Fdiv>\n -radius:11px;padding:10px 12px;text-align:center\"><div class=\"mono\" style=\"font-size:15px;font-weight:700;color:#eceef3\">47.5s<\u002Fdiv><div style=\"font:500 10px 'Space Grotesk';color:#7a7a88;margin-top:2px\">median<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex:1;background:#25252f;border-radius:11px;padding:10px 12px;text-align:center\"><div class=\"mono\" style=\"font-size:15px;font-weight:700;color:#eceef3\">52.5s<\u002Fdiv><div style=\"font:500 10px 'Space Grotesk';color:#7a7a88;margin-top:2px\">p75<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n\n            <button class=\"tapc\" onclick=\"{{ closeResult }}\" style=\"width:100%;border:0;background:hsl(220,70%,62%);color:#fff;border-radius:12px;padding:13px;font:700 15px 'Space Grotesk';cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\"><g fill=\"none\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"3.5\" r=\"2\"><\u002Fcircle><circle cx=\"4\" cy=\"8\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"12.5\" r=\"2\"><\u002Fcircle><line x1=\"5.7\" y1=\"7\" x2=\"10.3\" y2=\"4.5\"><\u002Fline><line x1=\"5.7\" y1=\"9\" x2=\"10.3\" y2=\"11.5\"><\u002Fline><\u002Fg><\u002Fsvg>\n              Share result\n            <\u002Fbutton>\n            <button class=\"tapc\" onclick=\"{{ closeResult }}\" style=\"width:100%;border:0;background:hsl(268,45%,55%);color:#fff;border-radius:12px;padding:13px;font:700 15px 'Space Grotesk';cursor:pointer\">{{ resultPrimaryLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- calendar / archive overlay -->\n        <sc-if value=\"{{ showCal }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"tapc\" onclick=\"{{ closeCal }}\" style=\"position:absolute;inset:0;background:rgba(6,6,10,.72);display:flex;align-items:flex-end;justify-cont  class=\"mono\" style=\"font-size:12px;font-weight:700;color:{{ c.fg }}\">{{ c.day }}<\u002Fspan>\n                    <sc-if value=\"{{ c.hasDot }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:{{ c.dotBg }};border:1px solid rgba(0,0,0,.45)\"><\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:13px;height:13px;border-radius:3px;background:#7a55e0;flex:none\"><\u002Fspan><span style=\"font:500 11px 'Space Grotesk';color:#8a8a97\">square fill — % of your best for the day<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#3f6be0;border:1px solid rgba(0,0,0,.45);flex:none;margin:1px\"><\u002Fspan><span style=\"font:500 11px 'Space Grotesk';color:#8a8a97\">dot — your ranked percentile (best of 3)<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- bottom nav -->\n        <div style=\"flex:none;display:flex;background:#101017;border-top:1px solid rgba(255,255,255,.06);padding:8px 10px 22px\">\n          <button class=\"tapc\" onclick=\"{{ goPlay }}\" style=\"flex:1;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 0\">\n            <svg width=\"22\" height=\"22\" viewBox=\"0 0 22 22\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"{{ navPlay }}\"><\u002Frect><rect x=\"12\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"{{ navPlayDim }}\"><\u002Frect><rect x=\"3\" y=\"12\" width=\"7\" height=\"7\" rx=\"1.5\" fill=\"{{ navPlayDim }}\"><\u002F ipt type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"play\",\n    showResult: false,\n    copied: false,\n    displayName: \"riverstone\",\n    nameDraft: \"\",\n    standGroup: 0,\n    standDay: 0,\n    showCal: false,\n    viewAttempt: 2,\n    nResults: true,\n    nGlobal: true,\n    nHeat: true,\n    nReminder: false,\n    zoomLevel: 60,\n    sound: true,\n    haptics: true,\n    motion: false,\n    notifsRead: false,\n    theme: \"system\",\n    attemptsLeft: 3,\n  };\n\n  go(screen) {\n    this.setState({ screen, showResult: false, copied: false });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const green = \"hsl(120,58%,76%)\";\n    // today's result percentile drives the banner color + icon\n    const beatPct = 58;\n    const beatHue = beatPct >= 50\n      ? { text: \"hsl(120,55%,64%)\", bg: \"rgba(120,180,90,.08)\", border: \"rgba(120,180,90,.3)\" }\n      : beatPct >= 25\n        ? { text: \"hsl(42,85%,62%)\", bg: \"rgba(224,168,0,.09)\", border: \"rgba(224,168,0,.32)\" }\n        : { text: \"hsl(8,72%,60%)\", bg: \"rgba(220,74,47,.09)\", border: \"rgba(220,74,47,.34)\" };\n    // checkmark for a win, neutral dash otherwise\n    const beatIcon = beatPct >= 50\n      ? React.createElement(\"svg\", { width: 15, height: 15, viewBox: \"0 0 16 16\" }, React.createElement(\"path\", { d: \"M3 8.5l3.4 3.4L13 4.2\", fill: \"none\", stroke: beatHue.text, strokeWidth: 1.8, strokeLinecap: \"round\", strokeLinejoin: \"round\" }))\n      : React.createElement(\"svg\", { width: 15, height: 15, viewBox: \"0 0 16 16\" }, React.createElement(\"path\", { d: \"M4 8h8\", fill: \"none\", stroke: beatHue.text, strokeWidth: 1.8, strokeLinecap: \"round\" }));\n    const pink = \"hsl(320,58%,78%)\";\n    const gridLines = [];\n    for (let gx = 2; gx <= 18; gx += 2) gridLines.push({ a: gx, b: 1, c: gx, d: 19 });\n    for (let gy = 2; gy <= 18; gy += 2) gridLines.push({ a: 1, b: gy, c: 19, d: gy });\n    const raw = [\n      [2,2,1],[5,3,0],[8,1,1],[12,2,0],[15,3,0],[3,5,0],[7,5,1],[11,4,1],\n      [15,6,1],[2,8,0],[6,8,0],[9,8,1],[13,8,0],[16,9,1],[4,11,1],[7,11,0],\n      [11,11,1],[14,11,0],[3,14,0],[6,14,0],[10,14,1],[13,14,1],[16,14,0],\n      [5,16,1],[9,16,0],[13,16,0],\n    ];\n    const blocks = raw.map(([x,y,g]) => ({ x, y, fill: g ? green : pink }));\n\n    // daily percentile squares (color ramp like the real app: red->yellow->green->blue->purple)\n    const ramp = [\"#dc4a2f\",\"#e0a800\",\"#5cc24a\",\"#3f6be0\",\"#7a55e0\"];\n    const mkColor = (p) => p == null ? \"#6a6a72\" : ramp[Math.min(4, Math.floor(p * 5))];\n    const dLabels = [\n      [88,0.86],[100,0.99],[74,0.7],[61,0.55],[52,0.48],[45,0.4],[93,0.9],\n      [null,null],[null,null],[null,null],[null,null],[null,null],[null,null],[null,null],\n    ];\n    const dailies = dLabels.map(([label, p], i) => ({\n      label: label == null ? \"–\" : String(label),\n      bg: mkColor(p),\n      fg: p == null ? \"#a9a9b3\" : (p > 0.35 && p < 0.72 ? \"#1a1a1a\" : \"#fff\"),\n      dot: p == null ? \"#4d4d55\" : (i % 2 ? \"hsl(220,70%,62%)\" : \"hsl(268,55%,62%)\"),\n      date: \"Daily #\" + (128 - i),\n    }));\n\n    // profile 14-day history heatmap\n    const histP = [0.9,0.6,0.75,null,0.5,0.82,0.95,0.4,0.68,0.7,0.88,0.55,null,0.78];\n    const history = histP.map((p) => ({ bg: p == null ? \"#26262f\" : mkColor(p) }));\n\n    // ---- Standings model (folds Heats + previous dailies into one board) ----\n    const groupsData = [\n      { id: \"global\", label: \"Global\", sub: \"2,431 today\", code: null },\n      { id: \"h1\", label: \"Heat 1\", sub: \"BL0X-42 · 6\", code: \"BL0X-42\" },\n      { id: \"h2\", label: \"Studio\", sub: \"11 players\", code: \"STDO-19\" },\n    ];\n    const daysData = [\n      { label: \"Today\", date: \"Jul 4\" },\n      { label: \"Wed\", date: \"Jul 3\" },\n      { label: \"Tue\", date: \"Jul 2\" },\n      { label: \"Mon\", date: \"Jul 1\" },\n      { label: \"Sun\", date: \"Jun 30\ prove loop); dot = your ranked percentile (best of 3).\n    const scoreRamp = [\"#e0a800\", \"#e2662f\", \"#c23f86\", \"#7a55e0\", \"#3f6be0\"];\n    const scoreDark = [true, true, false, false, false];\n    const scoreIdx = (p) => Math.min(4, Math.floor(p * 5));\n    const scoreColor = (p) => scoreRamp[scoreIdx(p)];\n    const dayData = {\n      1: { best: 0.96, rank: 0.70 },\n      2: { best: 0.46, rank: 0.33 },\n      3: { best: 0.92, rank: 0.52 },\n      4: { best: 1.00, rank: 0.58 },\n    };\n    const calWeekdays = [\"S\", \"M\", \"T\", \"W\", \"T\", \"F\", \"S\"];\n    const calDays = [];\n    for (let b = 0; b < 3; b++) calDays.push({ blank: true });\n    for (let d = 1; d <= 31; d++) {\n      const dd = dayData[d];\n      const future = d > 4;\n      const played = !!dd;\n      const bi = played ? scoreIdx(dd.best) : -1;\n      calDays.push({\n        cell: true, day: String(d),\n        bg: played ? scoreColor(dd.best) : (future ? \"#161620\" : \"#26262f\"),\n        fg: played ? (scoreDark[bi] ? \"#1a1a1a\" : \"#fff\") : (future ? \"#3a3a44\" : \"#6a6a72\"),\n        hasDot: played,\n        dotBg: played ? scoreColor(dd.rank) : \"transparent\",\n        cursor: played ? \"pointer\" : \"default\",\n        ring: d === 4 ? \"0 0 0 2px #eceef3\" : \"none\",\n        pick: played ? (() => this.setState({ showCal: false })) : (() => {}),\n      });\n    }\n\n    const playerCounts = [\"2,431 players\", \"6 friends\", \"11 players\"];\n    const standPlayerCount = playerCounts[gi] + (isToday ? \" played today\" : \" \\u00b7 \" + daysData[di].date);\n\n    const navc = (name) => s.screen === name ? \"hsl(220,70%,62%)\" : \"#5c5c68\";\n    const navt = (name) => s.screen === name ? \"#eceef3\" : \"#6a6a77\";\n\n    return {\n      isPlay: s.screen === \"play\",\n      isStandings: s.screen === \"standings\",\n      isProfile: s.screen === \"profile\",\n      isSettings: s.screen === \"settings\",\n      isNotifs: s.screen === \"notifications\",\n      isName: s.
