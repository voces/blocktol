name: Deploy dev

# Deploys every pushed branch (except `prod`, which deploy.yml owns) to the dev
# instance on the EC2 cohost: it POSTs `{app:"blocktol-dev", version:<sha>}` to
# w3xio's /deploy webhook, which runs deploy/blocktol-dev-deploy. Dev is ONE
# instance, so the most recent push is what dev runs, and its boot applies that
# commit's pending migrations to blocktol-dev. No CI gate: a branch is deployed
# to be tried before review, as the Deno Deploy previews were. Off until the
# DEV_DEPLOY repository variable is "true" (set it once the box side of "Dev
# instance" in deploy/README.md is done), so pushes don't fail against a webhook
# that doesn't know the app yet.
on:
  push:
    branches-ignore: [prod]
  workflow_dispatch:

# A newer push replaces a queued or running one; the box serializes the deploys
# themselves (blocktol-dev-deploy's lock).
concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # A branch deletion is a push event too, with no commit to deploy.
    if: ${{ vars.DEV_DEPLOY == 'true' && !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy webhook
        if: env.DEPLOY_WEBHOOK_URL
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
        run: |
          curl -sf -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"app\": \"blocktol-dev\", \"version\": \"$SHA\"}"
