name: Deploy
on: [push]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Clone
        uses: actions/checkout@v2

      - name: Install
        uses: denoland/setup-deno@v1

      - name: Build
        run: ./bundle
      
      - name: Deploy
        uses: denoland/deployctl@v1
        with:
          project: "blocktol-dev"
          entrypoint: "./server/index.ts"