name: CI
on:
  push:
    branches: [prod]
  pull_request:

# This job only checks the code. Deployment: during the EC2 cohost migration two
# paths coexist — the Deno Deploy GitHub integration (app.deno.com), and
# deploy.yml, which fires after this workflow succeeds on `prod` and notifies the
# EC2 via w3xio's /deploy webhook. deploy.yml no-ops until DEPLOY_WEBHOOK_URL is
# set, and the Deno Deploy integration is disconnected at cutover. See
# deploy/README.md.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        # Enforces the no-console ban (server + common; scripts/client are
        # excluded in deno.jsonc). See deno.jsonc `lint`.
        run: deno lint

      - name: Generate version
        # common/version.ts is gitignored/generated; both server/index.ts and
        # client/index.ts import it, so it must exist before the type check (and
        # the build regenerates it anyway). git is present here (checkout).
        run: deno task version

      - name: Generate i18n
        # common/i18n.generated.ts is gitignored/generated from i18n/*.json; the
        # type check and tests reach it through common/notifications.ts, so it
        # must exist first (the build regenerates it anyway).
        run: deno task i18n

      - name: Type check
        run: deno check server/index.ts client/index.ts common/pathing.ts

      - name: Test
        run: deno task test
        # The run-lifecycle integration tests exercise the dev database when
        # SQL_PASSWORD is configured as a repository secret; without it they
        # self-skip and only the pure tests run.
        env:
          APP_ENV: dev
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}

      - name: Build client
        run: deno task build
