name: CI
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:

# This job only checks the code. Deployment is separate: deploy.yml (prod) and
# deploy-dev.yml (the dev instance) fire after this workflow succeeds on `prod`
# and notify the EC2 box via w3xio's /deploy webhook. See deploy/README.md.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run fmt:check

      - name: Lint
        # Enforces the no-console ban (server + common; scripts/client are
        # ignored in .oxlintrc.json).
        run: npm run lint

      - name: Type check
        # Generates common/version.ts and the compiled i18n catalogs first
        # (`npm run gen`); git is present here (checkout).
        run: npm run typecheck

      - name: i18n check
        # The "never deploy untranslated" gate: every target locale must carry a
        # current, valid translation of every en.json key (i18n:translate + the
        # Translate workflow heal it). Also fails on any key no code references.
        run: |
          npm run i18n:check
          npm run i18n:unused

      - name: Test
        run: npm test
        # The run-lifecycle integration tests exercise the dev database when
        # SQL_PASSWORD is configured as a repository secret; without it they
        # self-skip and only the pure tests run.
        env:
          APP_ENV: dev
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}

      - name: Build client
        run: npm run build
